<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    
    <!-- Link para o Visual -->
    <link rel="stylesheet" href="style.css">
    <!-- Link para o Comportamento (Interatividade) -->
    <script src="script.js" defer></script>
</head>

<body>
    
    <header>
    <div class="header-container">
        <!-- 1. Botão no canto esquerdo -->
        <button id="btn-hamburger" class="hamburger" aria-label="Abrir menu">
            &#9776;
        </button>

        <!-- 2. Logo ao lado do botão -->
        <div class="logo">
            <h1>Biomatec</h1>
        </div>

        <!-- 3. Menu oculto -->
        <nav id="menu-dropdown" class="menu-dropdown">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Faça Parte</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <form action="/enviar-cadastro" method="POST">
            
            <fieldset>
                <legend>Seus Dados Pessoais e Contato</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" 
                    placeholder="email@provedor.com"
                    required>
                </div>

            
                <!-- CAMPO TELEFONE COM PATTERN -->
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" 
                           placeholder="(11) 90000-0000"
                           pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" 
                           title="Digite o telefone no formato: (99) 99999-9999" required>
                </div>
                
                <div>
                    <label for="mensagem">Sua solicitação ou Detalhes do envio de doação:</label>
                 <!-- A tag textarea precisa ser aberta e fechada -->
                 <textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte-nos por que você quer ser voluntário..."></textarea>
</div>        
                
</div>
            </fieldset>

            <button type="submit">Contato</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Biomatec. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
